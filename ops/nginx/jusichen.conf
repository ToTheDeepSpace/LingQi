map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name jusichen.com www.jusichen.com;

    root /srv/jusichen/juzhanggui-mvp/dist/client;
    index index.html;
    client_max_body_size 20m;

    location /uploads/ {
        alias /srv/jusichen/juzhanggui-mvp/public/uploads/;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/jusichen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jusichen.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name jumulu.jusichen.com;

    root /srv/jusichen/LingQi/dist;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /uploads/ {
        alias /srv/jusichen/LingQi/public/uploads/;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/jusichen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jusichen.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# The former brand domain is now a pure redirect to the current domain.
server {
    server_name lingqi.jusichen.com;

    return 301 https://jumulu.jusichen.com$request_uri;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/jusichen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jusichen.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name jusichen.com www.jusichen.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name jumulu.jusichen.com;
    return 301 https://jumulu.jusichen.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name lingqi.jusichen.com;

    return 301 https://jumulu.jusichen.com$request_uri;
}
